apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-detection-service
  labels:
    app: feature-detection-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feature-detection-service
  template:
    metadata:
      labels:
        app: feature-detection-service
    spec:
      containers:
        - name: feature-detection-service
          image: your-dockerhub/feature-detection-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5200
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "5200"
            - name: FEATURE_DETECTOR
              value: "orb"
            - name: MAX_FEATURES
              value: "800"
            - name: MIN_KEYPOINTS
              value: "40"
            - name: NATS_URL
              value: "nats://nats.default.svc.cluster.local:4222"
            - name: FRAMES_SUBJECT
              value: "frames.raw"
            - name: FEATURES_SUBJECT
              value: "features.detected"
            - name: CORS_ORIGINS
              value: "*"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
