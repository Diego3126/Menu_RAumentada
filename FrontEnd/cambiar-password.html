<!DOCTYPE html>
<html lang="es">
<head>
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña — Restaurante Delicias</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --naranja: #ff8c42;
            --naranja-dark: #e67e22;
            --fondo: #0d0d0d;
            --borde: rgba(255,255,255,0.1);
            --texto: #f0ebe3;
            --texto-suave: rgba(240,235,227,0.55);
            --error: #ff5c5c;
            --exito: #4caf50;
        }

        body {
            min-height: 100vh;
            background: var(--fondo);
            background-image:
                radial-gradient(ellipse 80% 60% at 60% -10%, rgba(255,140,66,0.15) 0%, transparent 60%),
                url('https://wallpapercat.com/w/full/f/7/9/584472-3840x2160-desktop-4k-restaurant-background-image.jpg');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
            color: var(--texto);
            padding: 1rem;
        }

        /* ========== CARD ========== */
        .card {
            width: 100%;
            max-width: 440px;
            background: rgba(13,13,13,0.82);
            backdrop-filter: blur(28px);
            border: 1px solid var(--borde);
            border-radius: 24px;
            padding: 2.8rem 2.4rem;
            box-shadow: 0 32px 80px rgba(0,0,0,0.6);
            animation: aparecer 0.4s cubic-bezier(.22,1,.36,1) both;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ========== HEADER ========== */
        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--naranja), var(--naranja-dark));
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 8px 24px rgba(255,140,66,0.3);
        }

        .card-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            margin-bottom: 0.3rem;
        }

        .card-header p {
            font-size: 0.85rem;
            color: var(--texto-suave);
        }

        /* ========== INDICADOR DE FORTALEZA ========== */
        .fortaleza-wrap {
            margin-top: 8px;
        }

        .fortaleza-bar {
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.1);
            overflow: hidden;
            margin-bottom: 4px;
        }

        .fortaleza-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s, background 0.3s;
            width: 0%;
        }

        .fortaleza-label {
            font-size: 0.75rem;
            color: var(--texto-suave);
        }

        /* ========== FORM ========== */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--texto-suave);
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--texto-suave);
            font-size: 0.9rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--borde);
            border-radius: 12px;
            padding: 0.85rem 2.8rem 0.85rem 2.6rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            color: var(--texto);
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .form-input::placeholder { color: rgba(240,235,227,0.25); }

        .form-input:focus {
            border-color: var(--naranja);
            background: rgba(255,140,66,0.07);
            box-shadow: 0 0 0 3px rgba(255,140,66,0.15);
        }

        .form-input.input-error { border-color: var(--error); background: rgba(255,92,92,0.06); }
        .form-input.input-ok    { border-color: var(--exito); }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--texto-suave);
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--naranja); }

        /* Errores por campo */
        .field-error {
            font-size: 0.78rem;
            color: var(--error);
            margin-top: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.2s, transform 0.2s;
        }
        .field-error.visible { opacity: 1; transform: translateY(0); }

        /* ========== ALERTA GLOBAL MRA-89 ========== */
        .alerta {
            border-radius: 12px;
            padding: 0.9rem 1rem;
            font-size: 0.88rem;
            margin-bottom: 1.4rem;
            display: none;
            align-items: center;
            gap: 0.7rem;
            animation: slideIn 0.25s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .alerta.error  { background: rgba(255,92,92,0.12); border: 1px solid rgba(255,92,92,0.3); color: #ff8f8f; display: flex; }
        .alerta.exito  { background: rgba(76,175,80,0.12); border: 1px solid rgba(76,175,80,0.3); color: #81c784; display: flex; }

        /* ========== BOTÓN ========== */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--naranja), var(--naranja-dark));
            border: none;
            border-radius: 12px;
            padding: 0.95rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            box-shadow: 0 6px 20px rgba(255,140,66,0.3);
            margin-top: 0.4rem;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 28px rgba(255,140,66,0.4);
        }

        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-submit .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        .btn-submit.cargando .btn-texto { display: none; }
        .btn-submit.cargando .spinner   { display: block; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========== LINK VOLVER ========== */
        .link-volver {
            display: block;
            text-align: center;
            color: var(--texto-suave);
            font-size: 0.85rem;
            text-decoration: none;
            margin-top: 1.3rem;
            transition: color 0.2s;
        }
        .link-volver:hover { color: var(--naranja); }

        /* ========== RESPONSIVE MRA-92 ========== */
        @media (max-width: 480px) {
            body { justify-content: flex-end; padding: 0; }
            .card {
                border-radius: 24px 24px 0 0;
                padding: 2rem 1.5rem 2.5rem;
                max-width: 100%;
                border-bottom: none;
            }
        }
    </style>
</head>
<body>

<div class="card">

    <div class="card-header">
        <div class="header-icon">🔑</div>
        <h1>Cambiar contraseña</h1>
        <p>Actualiza tu contraseña de acceso</p>
    </div>

    <!-- Alerta global MRA-89 -->
    <div class="alerta" id="alerta" role="alert">
        <i id="alertaIcono"></i>
        <span id="alertaMensaje"></span>
    </div>

    <form id="formCambio" novalidate>

        <!-- Contraseña actual MRA-85 -->
        <div class="form-group">
            <label class="form-label" for="passwordActual">Contraseña actual</label>
            <div class="input-wrapper">
                <input type="password" id="passwordActual" class="form-input" placeholder="••••••••" autocomplete="current-password" required />
                <i class="fas fa-lock input-icon"></i>
                <button type="button" class="toggle-password" data-target="passwordActual" data-icon="ico1" aria-label="Mostrar contraseña">
                    <i class="fas fa-eye" id="ico1"></i>
                </button>
            </div>
            <div class="field-error" id="errorActual">
                <i class="fas fa-circle-xmark"></i><span id="msgActual"></span>
            </div>
        </div>

        <!-- Nueva contraseña MRA-86 -->
        <div class="form-group">
            <label class="form-label" for="passwordNueva">Nueva contraseña</label>
            <div class="input-wrapper">
                <input type="password" id="passwordNueva" class="form-input" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required />
                <i class="fas fa-lock-open input-icon"></i>
                <button type="button" class="toggle-password" data-target="passwordNueva" data-icon="ico2" aria-label="Mostrar contraseña">
                    <i class="fas fa-eye" id="ico2"></i>
                </button>
            </div>
            <!-- Indicador de fortaleza -->
            <div class="fortaleza-wrap">
                <div class="fortaleza-bar">
                    <div class="fortaleza-fill" id="fortalezaFill"></div>
                </div>
                <span class="fortaleza-label" id="fortalezaLabel"></span>
            </div>
            <div class="field-error" id="errorNueva">
                <i class="fas fa-circle-xmark"></i><span id="msgNueva"></span>
            </div>
        </div>

        <!-- Confirmar contraseña MRA-86 -->
        <div class="form-group">
            <label class="form-label" for="passwordConfirmar">Confirmar nueva contraseña</label>
            <div class="input-wrapper">
                <input type="password" id="passwordConfirmar" class="form-input" placeholder="Repite la nueva contraseña" autocomplete="new-password" required />
                <i class="fas fa-check-double input-icon"></i>
                <button type="button" class="toggle-password" data-target="passwordConfirmar" data-icon="ico3" aria-label="Mostrar contraseña">
                    <i class="fas fa-eye" id="ico3"></i>
                </button>
            </div>
            <div class="field-error" id="errorConfirmar">
                <i class="fas fa-circle-xmark"></i><span id="msgConfirmar"></span>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
            <span class="btn-texto">Actualizar contraseña</span>
            <span class="spinner"></span>
        </button>

    </form>

    <a href="javascript:history.back()" class="link-volver">
        <i class="fas fa-arrow-left" style="margin-right:0.3rem;"></i> Volver
    </a>

</div>

<script src="config.js"></script>
<script src="auth-helper.js"></script>
<script>
    // ========== INIT: esperar que el DOM esté listo ==========
    document.addEventListener('DOMContentLoaded', () => {

        // API_URL viene de config.js

        // MRA-90: Verificar sesión activa
        const token   = localStorage.getItem('token');
        const usuarioStr = localStorage.getItem('usuario');
        if (!token || !usuarioStr) {
            window.location.href = '/login';
            return;
        }

        // ========== TOGGLE MOSTRAR/OCULTAR CONTRASEÑA ==========
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const inputId = btn.getAttribute('data-target');
                const iconId  = btn.getAttribute('data-icon');
                const input   = document.getElementById(inputId);
                const icon    = document.getElementById(iconId);
                const esPassword = input.type === 'password';
                input.type     = esPassword ? 'text' : 'password';
                icon.className = esPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
            });
        });

        // ========== INDICADOR DE FORTALEZA MRA-86 ==========
        document.getElementById('passwordNueva').addEventListener('input', function() {
            const val   = this.value;
            const fill  = document.getElementById('fortalezaFill');
            const label = document.getElementById('fortalezaLabel');

            let fuerza = 0;
            if (val.length >= 6)           fuerza++;
            if (val.length >= 10)          fuerza++;
            if (/[A-Z]/.test(val))         fuerza++;
            if (/[0-9]/.test(val))         fuerza++;
            if (/[^A-Za-z0-9]/.test(val))  fuerza++;

            const config = [
                { pct: '0%',   color: 'transparent', txt: '' },
                { pct: '25%',  color: '#ff5c5c',      txt: 'Muy débil' },
                { pct: '50%',  color: '#ff8c42',      txt: 'Débil' },
                { pct: '75%',  color: '#ffd54f',      txt: 'Aceptable' },
                { pct: '90%',  color: '#81c784',      txt: 'Fuerte' },
                { pct: '100%', color: '#4caf50',      txt: 'Muy fuerte' },
            ];

            fill.style.width      = config[fuerza].pct;
            fill.style.background = config[fuerza].color;
            label.textContent     = config[fuerza].txt;
            label.style.color     = config[fuerza].color;
            limpiarError('errorNueva');
        });

        // ========== VALIDACIONES ==========
        document.getElementById('passwordActual').addEventListener('blur', validarActual);
        document.getElementById('passwordNueva').addEventListener('blur', validarNueva);
        document.getElementById('passwordConfirmar').addEventListener('blur', validarConfirmar);
        document.getElementById('passwordActual').addEventListener('input', () => limpiarError('errorActual'));
        document.getElementById('passwordConfirmar').addEventListener('input', () => {
            limpiarError('errorConfirmar');
            const conf  = document.getElementById('passwordConfirmar').value;
            const nueva = document.getElementById('passwordNueva').value;
            if (conf && nueva && conf !== nueva) {
                mostrarErrorCampo('errorConfirmar', 'msgConfirmar', 'Las contraseñas no coinciden');
                document.getElementById('passwordConfirmar').classList.add('input-error');
            }
        });

        function validarActual() {
            const val = document.getElementById('passwordActual').value;
            if (!val) return mostrarErrorCampo('errorActual', 'msgActual', 'Ingresa tu contraseña actual');
            marcarOk(document.getElementById('passwordActual'));
            return true;
        }

        function validarNueva() {
            const val    = document.getElementById('passwordNueva').value;
            const actual = document.getElementById('passwordActual').value;
            if (!val)          return mostrarErrorCampo('errorNueva', 'msgNueva', 'Ingresa la nueva contraseña');
            if (val.length < 6) return mostrarErrorCampo('errorNueva', 'msgNueva', 'Mínimo 6 caracteres');
            if (val === actual) return mostrarErrorCampo('errorNueva', 'msgNueva', 'Debe ser diferente a la actual');
            marcarOk(document.getElementById('passwordNueva'));
            return true;
        }

        function validarConfirmar() {
            const conf  = document.getElementById('passwordConfirmar').value;
            const nueva = document.getElementById('passwordNueva').value;
            if (!conf)        return mostrarErrorCampo('errorConfirmar', 'msgConfirmar', 'Confirma la nueva contraseña');
            if (conf !== nueva) return mostrarErrorCampo('errorConfirmar', 'msgConfirmar', 'Las contraseñas no coinciden');
            marcarOk(document.getElementById('passwordConfirmar'));
            return true;
        }

        function mostrarErrorCampo(errorId, msgId, mensaje) {
            document.getElementById(errorId).classList.add('visible');
            document.getElementById(msgId).textContent = mensaje;
            return false;
        }

        function limpiarError(errorId) {
            document.getElementById(errorId).classList.remove('visible');
        }

        function marcarOk(input) {
            input.classList.remove('input-error');
            input.classList.add('input-ok');
        }

        // ========== ALERTA GLOBAL ==========
        function mostrarAlerta(tipo, mensaje) {
            const alerta = document.getElementById('alerta');
            const icono  = document.getElementById('alertaIcono');
            const msg    = document.getElementById('alertaMensaje');
            alerta.className = `alerta ${tipo}`;
            icono.className  = tipo === 'error' ? 'fas fa-circle-exclamation' : 'fas fa-circle-check';
            msg.textContent  = mensaje;
        }

        // ========== SUBMIT ==========
        document.getElementById('formCambio').addEventListener('submit', async (e) => {
            e.preventDefault();

            const ok1 = validarActual();
            const ok2 = validarNueva();
            const ok3 = validarConfirmar();
            if (!ok1 || !ok2 || !ok3) return;

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.classList.add('cargando');
            document.getElementById('alerta').className = 'alerta';

            try {
                const resp = await fetch(`${API_URL}/auth/cambiar-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        passwordActual:    document.getElementById('passwordActual').value,
                        passwordNueva:     document.getElementById('passwordNueva').value,
                        passwordConfirmar: document.getElementById('passwordConfirmar').value
                    })
                });

                const data = await resp.json();

                if (!resp.ok) {
                    mostrarAlerta('error', data.error || 'Error al cambiar la contraseña.');
                    if (resp.status === 401) {
                        document.getElementById('passwordActual').classList.add('input-error');
                        mostrarErrorCampo('errorActual', 'msgActual', 'Contraseña incorrecta');
                    }
                    return;
                }

                mostrarAlerta('exito', '✅ ' + data.mensaje + ' Serás redirigido...');
                document.getElementById('formCambio').reset();

                setTimeout(() => {
                    const u = JSON.parse(localStorage.getItem('usuario'));
                    window.location.href = u?.rol === 'admin' ? '/admin.html' : '/cocina.html';
                }, 2000);

            } catch (err) {
                mostrarAlerta('error', 'No se pudo conectar con el servidor.');
            } finally {
                btn.disabled = false;
                btn.classList.remove('cargando');
            }
        });

    }); // fin DOMContentLoaded
</script>

</body>
</html>
