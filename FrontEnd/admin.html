<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Menú AR</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="admin-main">
        <h2>Panel Admin</h2>
        <div id="adminInfo"></div>

        <section>
            <h3>Crear nuevo plato</h3>
            <form id="createPlatoForm">
                <input id="p_nombre" placeholder="Nombre" required>
                <input id="p_precio" placeholder="Precio" required type="number" step="0.01">
                <input id="p_categoria" placeholder="Categoría">
                <button type="submit">Crear</button>
            </form>
            <div id="createResult"></div>
        </section>

        <section>
            <h3>Platos</h3>
            <div id="adminPlatosList">Cargando...</div>
        </section>
    </main>

    <script src="admin.js"></script>
</body>
</html>
