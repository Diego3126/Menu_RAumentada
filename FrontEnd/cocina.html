<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Cocina — Restaurante Delicias</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        /* Reset global styles.css que aplica fondo de restaurante */
        body {
            background-image: none !important;
            background-attachment: unset !important;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'DM Sans', sans-serif;
            color: #f0ebe3;
        }

        nav {
            background: rgba(10,10,10,0.97);
            border-bottom: 1px solid rgba(76,175,80,0.2);
            padding: 0 2rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: #4caf50;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .main {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .page-header {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
        }

        .refresh-btn {
            background: rgba(76,175,80,0.12);
            border: 1px solid rgba(76,175,80,0.25);
            color: #81c784;
            padding: 0.5rem 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .refresh-btn:hover { background: rgba(76,175,80,0.2); }

        /* FILTROS MRA-134 */
        .header-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filtros {
            display: flex;
            gap: 0.4rem;
        }

        .filtro-btn {
            padding: 0.5rem 0.9rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: rgba(240,235,227,0.5);
        }

        .filtro-btn:hover { background: rgba(255,255,255,0.08); color: #f0ebe3; }
        .filtro-btn.active-todos         { background: rgba(255,255,255,0.12);  color: #f0ebe3;  border-color: rgba(255,255,255,0.25); }
        .filtro-btn.active-pendiente     { background: rgba(255,213,79,0.15);   color: #ffd54f;  border-color: rgba(255,213,79,0.35);  }
        .filtro-btn.active-en_preparacion{ background: rgba(100,181,246,0.15);  color: #64b5f6;  border-color: rgba(100,181,246,0.35); }
        .filtro-btn.active-listo         { background: rgba(129,199,132,0.15);  color: #81c784;  border-color: rgba(129,199,132,0.35); }

        /* PEDIDOS GRID */
        .pedidos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .pedido-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 1.2rem;
            transition: transform 0.2s;
        }

        .pedido-card:hover { transform: translateY(-2px); }

        .pedido-card.pendiente  { border-top: 3px solid #ffd54f; }
        .pedido-card.en-proceso { border-top: 3px solid #64b5f6; }
        .pedido-card.listo      { border-top: 3px solid #81c784; opacity: 0.7; }

        .pedido-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .pedido-codigo {
            font-weight: 600;
            font-size: 1rem;
            color: #ff8c42;
        }

        .estado-badge {
            font-size: 0.72rem;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-weight: 500;
        }

        .badge-pendiente  { background: rgba(255,213,79,0.15);  color: #ffd54f; }
        .badge-en-proceso { background: rgba(100,181,246,0.15); color: #64b5f6; }
        .badge-listo      { background: rgba(129,199,132,0.15); color: #81c784; }

        .pedido-cliente {
            font-size: 0.88rem;
            color: rgba(240,235,227,0.6);
            margin-bottom: 0.8rem;
        }

        .pedido-items {
            font-size: 0.82rem;
            color: rgba(240,235,227,0.8);
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 0.7rem;
            margin-bottom: 0.8rem;
            line-height: 1.6;
        }

        .pedido-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-accion {
            flex: 1;
            padding: 0.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-proceso {
            background: rgba(100,181,246,0.15);
            color: #64b5f6;
            border: 1px solid rgba(100,181,246,0.25);
        }

        .btn-proceso:hover { background: rgba(100,181,246,0.25); }

        .btn-listo {
            background: rgba(129,199,132,0.15);
            color: #81c784;
            border: 1px solid rgba(129,199,132,0.25);
        }

        .btn-listo:hover { background: rgba(129,199,132,0.25); }

        .btn-completado {
            background: rgba(129,199,132,0.08);
            color: rgba(129,199,132,0.6);
            border: 1px solid rgba(129,199,132,0.15);
            font-style: italic;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: rgba(240,235,227,0.3);
        }

        .empty-state i { font-size: 3rem; margin-bottom: 1rem; display: block; }

        /* RESPONSIVE MRA-69 */
        @media (max-width: 600px) {
            nav { padding: 0 1rem; }
            .main { padding: 1rem; }
            .pedidos-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-brand">👨‍🍳 Vista Cocina</div>
    <a href="/cambiar-password" style="color:rgba(76,175,80,0.7);font-size:0.85rem;text-decoration:none;display:flex;align-items:center;gap:0.4rem;transition:color 0.2s;" onmouseover="this.style.color='#81c784'" onmouseout="this.style.color='rgba(76,175,80,0.7)'">
        <i class="fas fa-key"></i> Cambiar contraseña
    </a>
    <div id="userInfo"></div>
</nav>

<main class="main">
    <div class="page-header">
        <div>
            <h1>Pedidos en curso</h1>
            <p style="color:rgba(240,235,227,0.4);font-size:0.85rem;margin-top:0.2rem;" id="ultimaActualizacion"></p>
        </div>
        <button class="refresh-btn" onclick="cargarPedidos()">
            <i class="fas fa-rotate-right"></i> Actualizar
        </button>
        <div class="filtros">
            <button class="filtro-btn active-todos" data-filtro="todos" onclick="setFiltro('todos', this)">Todos</button>
            <button class="filtro-btn" data-filtro="pendiente" onclick="setFiltro('pendiente', this)">🟡 Pendiente</button>
            <button class="filtro-btn" data-filtro="en_preparacion" onclick="setFiltro('en_preparacion', this)">🔵 En preparación</button>
            <button class="filtro-btn" data-filtro="listo" onclick="setFiltro('listo', this)">🟢 Listo</button>
        </div>
    </div>

    <div class="pedidos-grid" id="pedidosGrid">
        <div class="empty-state"><i class="fas fa-spinner fa-spin"></i>Cargando pedidos...</div>
    </div>
</main>

<script src="auth-helper.js"></script>
<script>
    // MRA-119: MRA-66: Solo cocineros pueden acceder a esta vista
    const usuario = requireRol('cocinero');
    if (usuario) {
        renderUserInfo(usuario);
        cargarPedidos();
        // MRA-122: Auto-refresh cada 30 segundos para ver pedidos nuevos
        setInterval(cargarPedidos, 30000);
    }

    // MRA-134: Filtro activo — 'todos' por defecto
    let filtroActivo = 'todos';

    function setFiltro(filtro, btnEl) {
        filtroActivo = filtro;
        // Limpiar clases activas de todos los botones
        document.querySelectorAll('.filtro-btn').forEach(b => {
            b.className = 'filtro-btn';
        });
        // Activar el botón seleccionado
        btnEl.classList.add(`active-${filtro}`);
        // Re-renderizar con el filtro aplicado
        cargarPedidos();
    }

    // MRA-122: Cargar y mostrar pedidos visibles para cocina
    async function cargarPedidos() {
        const token = localStorage.getItem('token');
        const grid  = document.getElementById('pedidosGrid');

        try {
            // MRA-120: GET /api/pedidos — backend filtra por rol automáticamente
            const res = await fetch(`${API_URL}/pedidos`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            // MRA-126: Manejo de errores de auth
            if (res.status === 401) {
                localStorage.removeItem('token');
                localStorage.removeItem('usuario');
                window.location.href = '/login';
                return;
            }

            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            const pedidos = await res.json();

            // Filtrar: cocina ve pendientes, en preparacion y listos
            const activos = pedidos.filter(p =>
                p.estado === 'pendiente' || p.estado === 'en_preparacion' || p.estado === 'listo'
            );

            // MRA-134: Aplicar filtro adicional seleccionado por el usuario
            const visibles = filtroActivo === 'todos'
                ? activos
                : activos.filter(p => p.estado === filtroActivo);

            // MRA-133: Ordenar del más antiguo al más nuevo (el que lleva más esperando va primero)
            visibles.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            document.getElementById('ultimaActualizacion').textContent =
                `Última actualización: ${new Date().toLocaleTimeString('es-CO')}`;

            if (pedidos.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-check-circle" style="color:#81c784"></i>
                        ¡Todo al día! No hay pedidos pendientes.
                    </div>`;
                return;
            }

            if (visibles.length === 0) {
                const labels = { pendiente: 'pendientes', en_preparacion: 'en preparación', listo: 'listos', todos: '' };
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-filter" style="color:rgba(240,235,227,0.3)"></i>
                        No hay pedidos ${labels[filtroActivo] || ''} en este momento.
                    </div>`;
                return;
            }

            // MRA-122: Renderizar tarjeta con items detallados de cada pedido
            grid.innerHTML = visibles.map(p => {
                const estadoClase = p.estado === 'en_preparacion' ? 'en-proceso' : p.estado;
                const badgeClase  = p.estado === 'en_preparacion' ? 'en-proceso' : p.estado;
                const estadoLabel = p.estado === 'en_preparacion' ? 'En preparación' : 
                                    p.estado.charAt(0).toUpperCase() + p.estado.slice(1);

                // MRA-122: Construir lista de items con personalizaciones
                const itemsHtml = (p.items || []).map(item => {
                    let extras = '';
                    if (item.ingredientes_eliminados && item.ingredientes_eliminados !== 'Ninguno' && item.ingredientes_eliminados !== '')
                        extras += `<span style="color:#ff6b6b;font-size:0.75rem;"> · Sin: ${item.ingredientes_eliminados}</span>`;
                    if (item.ingredientes_agregados && item.ingredientes_agregados !== 'Ninguno' && item.ingredientes_agregados !== '')
                        extras += `<span style="color:#81c784;font-size:0.75rem;"> · Extra: ${item.ingredientes_agregados}</span>`;
                    return `<div style="padding:0.2rem 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                                <strong>×${item.cantidad}</strong> ${item.plato_nombre}${extras}
                            </div>`;
                }).join('') || '<div style="color:rgba(255,255,255,0.3);font-size:0.8rem;">Sin detalles</div>';

                return `
                <div class="pedido-card ${estadoClase}" id="card-${p.id}">
                    <div class="pedido-header">
                        <span class="pedido-codigo">#${p.codigo_pedido}</span>
                        <span class="estado-badge badge-${badgeClase}">${estadoLabel}</span>
                    </div>
                    <div class="pedido-cliente">
                        <i class="fas fa-user" style="font-size:0.75rem;margin-right:0.3rem;"></i>
                        ${p.nombre_cliente}
                        ${p.notas ? `<br><i class="fas fa-note-sticky" style="font-size:0.75rem;margin-right:0.3rem;"></i><em style="color:rgba(240,235,227,0.5);">${p.notas}</em>` : ''}
                    </div>
                    <div class="pedido-items">${itemsHtml}</div>
                    <div style="font-size:0.78rem;color:rgba(240,235,227,0.4);margin-bottom:0.8rem;">
                        <i class="fas fa-clock" style="margin-right:0.3rem;"></i>${tiempoTranscurrido(p.created_at)}
                        &nbsp;·&nbsp; Total: <strong style="color:#ff8c42">$${parseFloat(p.total || 0).toFixed(2)}</strong>
                    </div>
                    <div class="pedido-actions">
                        ${p.estado === 'listo' ? `
                            <div class="btn-accion btn-completado" style="text-align:center;cursor:default;">
                                <i class="fas fa-check-circle"></i> Pedido listo
                            </div>` : `
                            ${p.estado === 'pendiente' ? `
                            <button class="btn-accion btn-proceso" onclick="cambiarEstado(${p.id}, 'en_preparacion', this)">
                                <i class="fas fa-fire"></i> En preparación
                            </button>` : ''}
                            <button class="btn-accion btn-listo" onclick="cambiarEstado(${p.id}, 'listo', this)">
                                <i class="fas fa-check"></i> Listo
                            </button>`}
                    </div>
                </div>`;
            }).join('');

        } catch (err) {
            console.error('Error al cargar pedidos:', err);
            grid.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-triangle-exclamation" style="color:#ff5c5c"></i>
                    Error al cargar pedidos. ¿Está el servidor corriendo?
                    <br><br>
                    <button onclick="cargarPedidos()" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;padding:0.5rem 1rem;border-radius:8px;cursor:pointer;font-family:inherit;">
                        <i class="fas fa-redo"></i> Reintentar
                    </button>
                </div>`;
        }
    }

    // MRA-120: Cambiar estado del pedido vía PATCH /api/pedidos/:id/estado
    async function cambiarEstado(pedidoId, nuevoEstado, btnEl) {
        const token = localStorage.getItem('token');

        // Deshabilitar botón mientras procesa
        if (btnEl) { btnEl.disabled = true; btnEl.style.opacity = '0.5'; }

        try {
            const res = await fetch(`${API_URL}/pedidos/${pedidoId}/estado`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ estado: nuevoEstado })
            });

            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.error || `HTTP ${res.status}`);
            }

            // MRA-122: Actualizar vista sin recargar toda la página
            await cargarPedidos();

        } catch (err) {
            console.error('Error al cambiar estado:', err);
            if (btnEl) { btnEl.disabled = false; btnEl.style.opacity = '1'; }
            // Mostrar error en pantalla sin alert()
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;background:#2e1a1a;border:1px solid rgba(255,107,107,0.4);color:#ff6b6b;padding:0.8rem 1.2rem;border-radius:12px;font-size:0.88rem;z-index:999;';
            errDiv.textContent = `No se pudo actualizar el estado: ${err.message}`;
            document.body.appendChild(errDiv);
            setTimeout(() => errDiv.remove(), 4000);
        }
    }

    function tiempoTranscurrido(fechaStr) {
        const diff = Math.floor((Date.now() - new Date(fechaStr)) / 60000);
        if (diff < 1)  return 'hace un momento';
        if (diff < 60) return `hace ${diff} min`;
        return `hace ${Math.floor(diff / 60)}h ${diff % 60}min`;
    }
</script>

</body>
</html>
