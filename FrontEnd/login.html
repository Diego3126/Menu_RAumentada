<!DOCTYPE html>
<html lang="es">
<head>
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Restaurante Delicias</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --naranja: #ff8c42;
            --naranja-dark: #e67e22;
            --fondo: #0d0d0d;
            --card: rgba(255,255,255,0.04);
            --borde: rgba(255,255,255,0.1);
            --texto: #f0ebe3;
            --texto-suave: rgba(240,235,227,0.55);
            --error: #ff5c5c;
            --exito: #4caf50;
        }

        body {
            min-height: 100vh;
            background: var(--fondo);
            background-image:
                radial-gradient(ellipse 80% 60% at 60% -10%, rgba(255,140,66,0.18) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 10% 100%, rgba(255,140,66,0.08) 0%, transparent 55%),
                url('https://wallpapercat.com/w/full/f/7/9/584472-3840x2160-desktop-4k-restaurant-background-image.jpg');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
            color: var(--texto);
            padding: 1rem;
        }

        /* ========== CARD ========== */
        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(13,13,13,0.78);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--borde);
            border-radius: 24px;
            padding: 2.8rem 2.4rem;
            box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
            animation: aparecer 0.5s cubic-bezier(.22,1,.36,1) both;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(28px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ========== LOGO / HEADER ========== */
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icono {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--naranja), var(--naranja-dark));
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            margin-bottom: 1rem;
            box-shadow: 0 8px 24px rgba(255,140,66,0.35);
        }

        .login-logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--texto);
        }

        .login-logo p {
            font-size: 0.85rem;
            color: var(--texto-suave);
            margin-top: 0.3rem;
            font-weight: 300;
        }

        /* ========== FORMULARIO ========== */
        .form-group {
            margin-bottom: 1.2rem;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--texto-suave);
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--texto-suave);
            font-size: 0.9rem;
            transition: color 0.2s;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--borde);
            border-radius: 12px;
            padding: 0.85rem 1rem 0.85rem 2.6rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            color: var(--texto);
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .form-input::placeholder { color: rgba(240,235,227,0.3); }

        .form-input:focus {
            border-color: var(--naranja);
            background: rgba(255,140,66,0.07);
            box-shadow: 0 0 0 3px rgba(255,140,66,0.15);
        }

        .form-input:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            color: var(--naranja);
        }

        /* Toggle password */
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--texto-suave);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--naranja); }

        /* ========== ERRORES MRA-68 ========== */
        .field-error {
            font-size: 0.78rem;
            color: var(--error);
            margin-top: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.2s, transform 0.2s;
        }

        .field-error.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .form-input.input-error {
            border-color: var(--error);
            background: rgba(255,92,92,0.07);
        }

        .form-input.input-ok {
            border-color: var(--exito);
        }

        /* ========== ALERTA GLOBAL ========== */
        .alerta {
            border-radius: 10px;
            padding: 0.85rem 1rem;
            font-size: 0.88rem;
            margin-bottom: 1.2rem;
            display: none;
            align-items: center;
            gap: 0.6rem;
            animation: slideIn 0.25s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .alerta.error {
            background: rgba(255,92,92,0.12);
            border: 1px solid rgba(255,92,92,0.3);
            color: #ff8f8f;
            display: flex;
        }

        .alerta.exito {
            background: rgba(76,175,80,0.12);
            border: 1px solid rgba(76,175,80,0.3);
            color: #81c784;
            display: flex;
        }

        /* ========== BOTÓN ========== */
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--naranja), var(--naranja-dark));
            border: none;
            border-radius: 12px;
            padding: 0.95rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            box-shadow: 0 6px 20px rgba(255,140,66,0.3);
            position: relative;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 28px rgba(255,140,66,0.4);
        }

        .btn-login:active:not(:disabled) { transform: translateY(0); }

        .btn-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* Estado de carga MRA-68 */
        .btn-login .btn-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        .btn-login.cargando .btn-texto { display: none; }
        .btn-login.cargando .btn-spinner { display: block; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== DIVIDER ========== */
        .divider {
            text-align: center;
            color: var(--texto-suave);
            font-size: 0.78rem;
            margin: 1.4rem 0;
            position: relative;
        }

        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: var(--borde);
        }

        .divider::before { left: 0; }
        .divider::after  { right: 0; }

        /* ========== LINK VOLVER ========== */
        .link-volver {
            display: block;
            text-align: center;
            color: var(--texto-suave);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
            margin-top: 1.2rem;
        }

        .link-volver:hover { color: var(--naranja); }
        .link-volver i { margin-right: 0.3rem; }

        /* ========== ROLES BADGE ========== */
        .roles-hint {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1.4rem;
            flex-wrap: wrap;
        }

        .rol-badge {
            font-size: 0.75rem;
            padding: 0.3rem 0.75rem;
            border-radius: 20px;
            border: 1px solid var(--borde);
            color: var(--texto-suave);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .rol-badge i { font-size: 0.7rem; }

        /* ========== RESPONSIVE MRA-69 ========== */
        @media (max-width: 480px) {
            body { padding: 0; align-items: flex-end; }

            .login-card {
                border-radius: 24px 24px 0 0;
                padding: 2rem 1.5rem 2.5rem;
                max-width: 100%;
                border-bottom: none;
            }

            .logo-icono { width: 52px; height: 52px; font-size: 1.4rem; }
            .login-logo h1 { font-size: 1.5rem; }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .login-card { max-width: 380px; padding: 2.2rem 2rem; }
        }
    </style>
    <script src="config.js"></script>
</head>
<body>

<div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
        <div class="logo-icono">🍽️</div>
        <h1>Restaurante Delicias</h1>
        <p>Panel de administración</p>
    </div>

    <!-- Alerta global MRA-68 -->
    <div class="alerta" id="alerta" role="alert">
        <i class="fas fa-circle-exclamation" id="alertaIcono"></i>
        <span id="alertaMensaje"></span>
    </div>

    <!-- Formulario -->
    <form id="loginForm" novalidate>

        <!-- Email -->
        <div class="form-group">
            <label class="form-label" for="email">Correo electrónico</label>
            <div class="input-wrapper">
                <input
                    type="email"
                    id="email"
                    class="form-input"
                    placeholder="tu@correo.com"
                    autocomplete="email"
                    required
                />
                <i class="fas fa-envelope input-icon"></i>
            </div>
            <div class="field-error" id="emailError">
                <i class="fas fa-circle-xmark"></i>
                <span id="emailErrorMsg"></span>
            </div>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label class="form-label" for="password">Contraseña</label>
            <div class="input-wrapper">
                <input
                    type="password"
                    id="password"
                    class="form-input"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                />
                <i class="fas fa-lock input-icon"></i>
                <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
                    <i class="fas fa-eye" id="toggleIcon"></i>
                </button>
            </div>
            <div class="field-error" id="passwordError">
                <i class="fas fa-circle-xmark"></i>
                <span id="passwordErrorMsg"></span>
            </div>
        </div>

        <!-- Botón MRA-68: carga -->
        <button type="submit" class="btn-login" id="btnLogin">
            <span class="btn-texto">Iniciar sesión</span>
            <span class="btn-spinner"></span>
        </button>

    </form>

    <div class="divider">acceso por rol</div>

    <!-- Indicadores de rol MRA-65 -->
    <div class="roles-hint">
        <div class="rol-badge"><i class="fas fa-user-shield"></i> Admin → panel completo</div>
        <div class="rol-badge"><i class="fas fa-utensils"></i> Cocinero → vista cocina</div>
    </div>

    <a href="/" class="link-volver"><i class="fas fa-arrow-left"></i> Volver al menú</a>

</div>

<script>
    // API_URL viene de config.js

    // ========== ELEMENTOS ==========
    const form       = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passInput  = document.getElementById('password');
    const btnLogin   = document.getElementById('btnLogin');
    const alerta     = document.getElementById('alerta');
    const alertaMsg  = document.getElementById('alertaMensaje');
    const alertaIco  = document.getElementById('alertaIcono');

    // ========== TOGGLE PASSWORD MRA-68 ==========
    document.getElementById('togglePassword').addEventListener('click', () => {
        const esPassword = passInput.type === 'password';
        passInput.type = esPassword ? 'text' : 'password';
        document.getElementById('toggleIcon').className = esPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
    });

    // ========== VALIDACIÓN EN TIEMPO REAL MRA-68 ==========
    emailInput.addEventListener('blur', () => validarEmail());
    passInput.addEventListener('blur',  () => validarPassword());
    emailInput.addEventListener('input', () => limpiarError('email'));
    passInput.addEventListener('input',  () => limpiarError('password'));

    function validarEmail() {
        const val = emailInput.value.trim();
        if (!val) return mostrarErrorCampo('email', 'El correo es obligatorio');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) return mostrarErrorCampo('email', 'Ingresa un correo válido');
        marcarOk('email');
        return true;
    }

    function validarPassword() {
        const val = passInput.value;
        if (!val) return mostrarErrorCampo('password', 'La contraseña es obligatoria');
        if (val.length < 4) return mostrarErrorCampo('password', 'Mínimo 4 caracteres');
        marcarOk('password');
        return true;
    }

    function mostrarErrorCampo(campo, mensaje) {
        const input = campo === 'email' ? emailInput : passInput;
        const errDiv = document.getElementById(`${campo}Error`);
        const errMsg = document.getElementById(`${campo}ErrorMsg`);
        input.classList.add('input-error');
        input.classList.remove('input-ok');
        errMsg.textContent = mensaje;
        errDiv.classList.add('visible');
        return false;
    }

    function marcarOk(campo) {
        const input = campo === 'email' ? emailInput : passInput;
        const errDiv = document.getElementById(`${campo}Error`);
        input.classList.remove('input-error');
        input.classList.add('input-ok');
        errDiv.classList.remove('visible');
    }

    function limpiarError(campo) {
        const input = campo === 'email' ? emailInput : passInput;
        const errDiv = document.getElementById(`${campo}Error`);
        input.classList.remove('input-error');
        errDiv.classList.remove('visible');
    }

    // ========== ALERTA GLOBAL ==========
    function mostrarAlerta(tipo, mensaje) {
        alerta.className = `alerta ${tipo}`;
        alertaIco.className = tipo === 'error'
            ? 'fas fa-circle-exclamation'
            : 'fas fa-circle-check';
        alertaMsg.textContent = mensaje;
    }

    function ocultarAlerta() {
        alerta.className = 'alerta';
    }

    // ========== ESTADO BOTÓN MRA-68 ==========
    function setCargando(cargando) {
        btnLogin.disabled = cargando;
        btnLogin.classList.toggle('cargando', cargando);
    }

    // ========== SUBMIT MRA-64/65 ==========
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        ocultarAlerta();

        const emailOk = validarEmail();
        const passOk  = validarPassword();
        if (!emailOk || !passOk) return;

        setCargando(true);

        try {
            const resp = await fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: emailInput.value.trim().toLowerCase(),
                    password: passInput.value
                })
            });

            const data = await resp.json();

            if (!resp.ok) {
                mostrarAlerta('error', data.error || 'Error al iniciar sesión');
                return;
            }

            // Guardar token y datos del usuario (MRA-70: logout limpia esto)
            localStorage.setItem('token', data.token);
            localStorage.setItem('usuario', JSON.stringify(data.usuario));

            mostrarAlerta('exito', `Bienvenido, ${data.usuario.nombre} 👋`);

            // MRA-65: redirigir según rol
            setTimeout(() => {
                window.location.href = data.redirigirA;
            }, 800);

        } catch (err) {
            mostrarAlerta('error', 'No se pudo conectar con el servidor. ¿Está corriendo el backend?');
        } finally {
            setCargando(false);
        }
    });

    // ========== MRA-71: si ya hay sesión, redirigir ==========
    window.addEventListener('DOMContentLoaded', () => {
        const token   = localStorage.getItem('token');
        const usuario = localStorage.getItem('usuario');
        if (token && usuario) {
            const u = JSON.parse(usuario);
            window.location.href = u.rol === 'admin' ? '/admin.html' : '/cocina.html';
        }
    });
</script>
</body>
</html>
