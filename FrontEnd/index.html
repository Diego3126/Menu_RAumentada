<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Menú AR - Restaurante</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- model-viewer: visor 3D + RA real en móvil -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GLTFLoader para cargar modelos GLB/GLTF -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="config.js"></script>
</head>
<body>

<header>
    <div class="header-flex">
        <a href="carrito.html" class="cart-icon" id="cartIcon">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-count" id="cartCount">0</span>
        </a>
        <div id="authControls" class="auth-controls">
            <a id="loginLink" href="login.html"><i class="fas fa-user"></i> Iniciar sesión</a>
            <a id="logoutLink" href="#" style="display:none; margin-left:10px;">Cerrar sesión</a>
            <a id="adminLink" href="/admin.html" target="_blank" style="display:none; margin-left:10px;">Admin</a>
        </div>
    </div>
    <h1>🍽️ Restaurante Delicias</h1>
    <p>Explora nuestro menú con Realidad Aumentada</p>
    <button id="arExperienceBtn" class="ar-btn">
        <i class="fas fa-camera"></i> Ver con Realidad Aumentada
    </button>
</header>

<main>
    <!-- Categorías (Subtarea MRA-5) -->
    <section class="categories">
        <h2>Categorías</h2>
        <div class="category-list" id="categoryList">
            <!-- JS llena aquí -->
            <div class="loading-spinner">Cargando categorías...</div>
        </div>
    </section>

    <!-- Lista de platos (Subtarea MRA-6) -->
    <section class="dishes">
        <h2>Platos</h2>
        <div class="dishes-grid" id="dishesGrid">
            <!-- JS llena aquí -->
            <div class="loading-spinner">Cargando platos...</div>
        </div>
    </section>
</main>

<!-- Modal de Realidad Aumentada - Visor 3D Interactivo -->
<div id="arModal" class="modal ar-modal">
    <div class="modal-content ar-content">

        <!-- Header -->
        <div style="display:flex; align-items:center; justify-content:space-between; padding: 1rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.08);">
            <h3 style="font-family:'Playfair Display',serif; font-size:1.1rem; color:white; margin:0;">
                <i class="fas fa-cube" style="color:#ff8c42; margin-right:0.5rem; font-size:0.9rem;"></i>
                <span id="dishNameAR"></span>
            </h3>
            <span class="close-ar-modal" style="font-size:1.5rem; color:rgba(255,255,255,0.4); cursor:pointer; line-height:1;">&times;</span>
        </div>

        <!-- model-viewer: 3D en PC, RA real con cámara en móvil -->
        <div style="position:relative; background:#1a1a1a; height: 380px;">
            <model-viewer
                id="modelViewerAR"
                src=""
                alt="Modelo 3D del plato"
                ar
                ar-modes="webxr scene-viewer quick-look"
                camera-controls
                auto-rotate
                auto-rotate-delay="1000"
                rotation-per-second="20deg"
                shadow-intensity="1"
                exposure="1"
                style="width:100%; height:100%; background:#1a1a1a;"
                loading="eager"
                reveal="auto">

                <!-- Botón AR nativo que aparece solo en móviles compatibles -->
                <button slot="ar-button" style="
                    position: absolute;
                    bottom: 1rem;
                    right: 1rem;
                    background: linear-gradient(135deg, #ff8c42, #e5631a);
                    color: white;
                    border: none;
                    border-radius: 50px;
                    padding: 0.7rem 1.2rem;
                    font-size: 0.9rem;
                    font-weight: 700;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    gap: 0.5rem;
                    box-shadow: 0 4px 15px rgba(255,140,66,0.5);
                    font-family: inherit;
                ">
                    <i class="fas fa-camera"></i> Ver con cámara
                </button>

                <!-- Poster/loading mientras carga el modelo -->
                <div slot="progress-bar" style="display:none;"></div>
            </model-viewer>

            <!-- Loading overlay -->
            <div id="mvLoading" style="
                position:absolute; inset:0;
                display:flex; flex-direction:column;
                align-items:center; justify-content:center;
                background:#1a1a1a; color:rgba(255,255,255,0.5);
                font-size:0.9rem; gap:0.75rem;
                pointer-events:none;
            ">
                <div style="width:32px;height:32px;border:3px solid #ff8c42;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
                Cargando modelo 3D...
            </div>
        </div>

        <!-- Controles e info -->
        <div style="padding: 0.9rem 1.5rem; border-top: 1px solid rgba(255,255,255,0.06);">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.6rem;">
                <p style="font-size:0.78rem; color:rgba(255,255,255,0.3); margin:0;">
                    <i class="fas fa-hand-pointer"></i> Arrastra para rotar &nbsp;·&nbsp;
                    <i class="fas fa-search-plus"></i> Pellizca para zoom
                </p>
                <span id="arBadgeMobile" style="display:none;
                    background:rgba(107,203,119,0.12); border:1px solid rgba(107,203,119,0.3);
                    color:#6bcb77; font-size:0.72rem; font-weight:600;
                    padding:0.2rem 0.6rem; border-radius:20px;">
                    <i class="fas fa-mobile-alt"></i> RA disponible
                </span>
            </div>

            <!-- Botón personalizar -->
            <button id="btnPersonalizarDesdeAR" style="
                background: linear-gradient(135deg, #ff8c42, #e5631a);
                color: white; border: none; padding: 0.85rem 2rem;
                border-radius: 50px; font-size: 1rem; font-weight: 700;
                cursor: pointer; width: 100%; font-family: inherit;
                box-shadow: 0 4px 15px rgba(255,140,66,0.4);
                transition: all 0.2s;
            "
            onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 6px 22px rgba(255,140,66,0.55)'"
            onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 4px 15px rgba(255,140,66,0.4)'">
                <i class="fas fa-sliders-h"></i>&nbsp; Personalizar y agregar al carrito
            </button>
        </div>

    </div>
</div>

<script src="3d-viewer.js"></script>
<script src="login.js"></script>
<script src="script.js"></script>
</body>
</html>
